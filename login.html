<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Login - Vago</title>

  <link rel="stylesheet"
        href="css/styles.css">

  <link rel="preconnect"
        href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

</head>

<body>

  <!-- =========================
       AUTH BRANDING
  ========================== -->

  <div class="auth-top-logo">

    <div class="logo-circle">
      ✈
    </div>

    <h1>Vago</h1>

    <p>AI Travel Planner</p>

  </div>


  <!-- =========================
       LOGIN CARD
  ========================== -->

  <section class="auth-section">

    <div class="auth-card">

      <h2>
        Welcome Back 👋
      </h2>

      <p>
        Login to continue planning your dream trips.
      </p>

      <input
        type="email"
        id="loginEmail"
        placeholder="Enter your email"
      >

      <input
        type="password"
        id="loginPassword"
        placeholder="Enter your password"
      >

      <button
        class="btn auth-btn"
        onclick="login()"
      >
        Login
      </button>

      <div class="auth-footer">

        Don’t have an account?

        <a href="register.html">
          Register
        </a>

      </div>

    </div>

  </section>

  <script src="js/app.js"></script>

</body>

</html>
