<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Register - Vago</title>

  <link rel="stylesheet"
        href="css/styles.css">

  <link rel="preconnect"
        href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

</head>

<body>

  <!-- =========================
       AUTH BRANDING
  ========================== -->

  <div class="auth-top-logo">

    <div class="logo-circle">
      ✈
    </div>

    <h1>Vago</h1>

    <p>AI Travel Planner</p>

  </div>


  <!-- =========================
       REGISTER CARD
  ========================== -->

  <section class="auth-section">

    <div class="auth-card">

      <h2>
        Create Account 🚀
      </h2>

      <p>
        Start planning smarter trips with AI.
      </p>

      <input
        type="text"
        id="name"
        placeholder="Enter your full name"
      >

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
      >

      <input
        type="password"
        id="password"
        placeholder="Create password"
      >

      <button
        class="btn auth-btn"
        onclick="register()"
      >
        Register
      </button>

      <div class="auth-footer">

        Already have an account?

        <a href="login.html">
          Login
        </a>

      </div>

    </div>

  </section>

  <script src="js/app.js"></script>

</body>

</html>
